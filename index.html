<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com<% if (supabaseConnectSrc) { %> <%= supabaseConnectSrc %><% } %>; connect-src 'self'<% if (supabaseConnectSrc) { %> <%= supabaseConnectSrc %><% } %><% if (ctx.dev) { %> ws://localhost:*<% } %>;<% if (ctx.dev) { %> worker-src 'self' blob:;<% } %>"
    />

    <!-- iOS standalone: open the home-screen icon as a full-screen app (no Safari bars) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="<%= productName %>">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png">
    <link rel="manifest" href="<%= publicPath %>manifest.json">

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">

    <!-- ---------- Launch splash (pure CSS) ----------
         Static app icon on a pale rose ground — the app underneath keeps its own
         paper colour, so dismissing the splash returns to #fafaf9.

         The CSP above is script-src 'self', so no inline <script> may run here;
         style-src allows 'unsafe-inline', so the fade-in is written as a CSS
         keyframe. It starts painting before the JS bundle has downloaded, so a
         cold start is no longer a blank page. Teardown lives in the bundle, in
         src/composables/use-app-splash.ts. -->
    <style>
      #cd-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fae9ee;
        transition: opacity .4s cubic-bezier(.22, 1, .36, 1);
        /* Fail-open. use-app-splash.ts only runs once App.vue mounts, and the auth
           boot file awaits getSession() before that — so a hung or very slow auth
           call means the JS fuse is never even armed, and this overlay would trap
           the user behind a full-screen splash with no way out but a reload.
           This timer starts at first paint and needs no JS at all, so it holds
           even if the bundle never executes. Longer than the JS fuse (6s) so it
           only ever fires when that path failed to arm. */
        animation: cd-splash-failopen 1ms linear 8s forwards;
      }

      @keyframes cd-splash-failopen {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      /* Added by use-app-splash.ts; the element is removed once the fade ends */
      #cd-splash.is-out {
        opacity: 0;
        pointer-events: none;
      }

      .cd-splash__icon {
        width: 128px;
        height: 128px;
        border-radius: 28px;
        opacity: 0;
        animation: cd-splash-icon .4s cubic-bezier(.22, 1, .36, 1) .1s forwards;
      }

      @keyframes cd-splash-icon {
        from { opacity: 0; transform: scale(.92); }
        to   { opacity: 1; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .cd-splash__icon { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Launch splash: sits outside the quasar mount point so mounting cannot replace it -->
    <div id="cd-splash" aria-hidden="true">
      <img class="cd-splash__icon" src="<%= publicPath %>icons/splash-icon.png" width="128" height="128" alt="">
    </div>

    <!-- quasar:entry-point -->
  </body>
</html>
