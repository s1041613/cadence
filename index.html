<!doctype html>
<html>

    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com<% if (supabaseConnectSrc) { %> <%= supabaseConnectSrc %><% } %>; connect-src 'self'<% if (supabaseConnectSrc) { %> <%= supabaseConnectSrc %><% } %><% if (ctx.dev) { %> ws://localhost:*<% } %>;<% if (ctx.dev) { %> worker-src 'self' blob:;<% } %>"
    />

    <!-- iOS standalone: open the home-screen icon as a full-screen app (no Safari bars) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="<%= productName %>">

    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">

    <!-- ---------- Launch animation (pure CSS) ----------
         The CADENCE wordmark drawn as a dot matrix, lit one column at a time from
         left to right — the beat crossing the word the app is named after. The soft
         rose ground is the splash only; it hands off to the app's own canvas when it
         fades, so there is no dark-to-light jump on a cold start.

         The dots are static SVG, sampled from the real Inter 500 outlines ahead of
         time by scripts/gen-splash-dots.mjs. Because the letters are drawn rather
         than typeset, the cold-start path loads no font at all.

         The CSP above is script-src 'self', so no inline <script> may run here;
         style-src allows 'unsafe-inline', so the animation is written as CSS
         keyframes over static SVG markup. It starts painting before the JS bundle
         has downloaded, so a cold start is no longer a blank page. Teardown lives
         in the bundle, in src/composables/use-app-splash.ts. -->
    <style>
      #cd-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #FBEDF1;
        transition: opacity .4s cubic-bezier(.22, 1, .36, 1);
        /* Fail-open. use-app-splash.ts only runs once App.vue mounts, and the auth
           boot file awaits getSession() before that — so a hung or very slow auth
           call means the JS fuse is never even armed, and this overlay would trap
           the user behind a full-screen splash with no way out but a reload.
           This timer starts at first paint and needs no JS at all, so it holds
           even if the bundle never executes. Longer than the JS fuse (6s) so it
           only ever fires when that path failed to arm. */
        animation: cd-splash-failopen 1ms linear 8s forwards;
      }

      @keyframes cd-splash-failopen {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      /* Added by use-app-splash.ts; the element is removed once the fade ends */
      #cd-splash.is-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Sized rather than full-bleed: the wordmark is ~6.7:1, so letting it fill the
         viewport would leave it a hairline on a phone and enormous on a desktop. */
      .cd-splash__matrix {
        display: block;
        width: min(84vw, 520px);
        height: auto;
      }

      .cd-splash__dots {
        fill: #A8566E;
      }

      /* One --d per column, inherited from the wrapping <g> —
         see scripts/gen-splash-dots.mjs. */
      .cd-splash__dots circle {
        opacity: 0;
        /* Scale each dot about its own centre rather than the viewBox origin */
        transform-box: fill-box;
        transform-origin: center;
        animation: cd-splash-dot .42s cubic-bezier(.34, 1.5, .6, 1) var(--d) forwards;
      }

      /* The playhead. Its travel is linear and spans exactly the column delays
         (0.28s to 1.43s), so it stays on the column lighting up under it. */
      .cd-splash__beat {
        fill: #DE6E8C;
        opacity: 0;
        transform-box: view-box;
        animation: cd-splash-beat 1.15s linear .28s forwards;
      }

      @keyframes cd-splash-dot {
        from { opacity: 0; transform: scale(.2); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes cd-splash-beat {
        0%   { opacity: 0;   transform: translateX(10px); }
        10%  { opacity: .32; }
        82%  { opacity: .32; }
        100% { opacity: 0;   transform: translateX(var(--travel)); }
      }

      /* Reduced-motion: jump straight to the finished state, play nothing. The
         playhead is a moving highlight with nothing left of it at the end, so it is
         simply never shown. Note this selects children only — the container keeps
         its fail-open animation, which is a safety timer rather than a motion
         effect. */
      @media (prefers-reduced-motion: reduce) {
        #cd-splash * { animation: none !important; }

        .cd-splash__dots circle { opacity: 1; }
        .cd-splash__beat { display: none; }
      }
    </style>
  </head>
  <body>

          <g style="--d:0.941s"><circle cx="360" cy="10" r="4"/><circle cx="360" cy="20" r="4"/><circle cx="360" cy="30" r="4"/><circle cx="360" cy="40" r="4"/><circle cx="360" cy="50" r="4"/><circle cx="360" cy="60" r="4"/><circle cx="360" cy="70" r="4"/><circle cx="360" cy="80" r="4"/></g>
