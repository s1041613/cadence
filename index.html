<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com<% if (supabaseConnectSrc) { %> <%= supabaseConnectSrc %><% } %>; connect-src 'self'<% if (supabaseConnectSrc) { %> <%= supabaseConnectSrc %><% } %><% if (ctx.dev) { %> ws://localhost:*<% } %>;<% if (ctx.dev) { %> worker-src 'self' blob:;<% } %>"
    />

    <!-- iOS standalone: open the home-screen icon as a full-screen app (no Safari bars) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="<%= productName %>">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png">
    <link rel="manifest" href="<%= publicPath %>manifest.json">

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">

    <!-- ---------- Launch screen ----------
         The app mark, centred, arriving: the calendar rises and fades in while the
         sparkles light up one after another and then keep breathing for as long as
         the screen is up. Both layers are transparent, so the ground is simply the
         app's own paper colour — dismissing the screen reveals the same #fafaf9
         underneath and there is no colour shift across the fade.

         The artwork ships as two layers cut from the one drawing:
         splash-core.png is the calendar and its tail, splash-sparks.png is the six
         sparkles, both on the same 768x663 canvas so stacking them registers exactly.
         Each sparkle is one more copy of the sparkle layer clipped to that sparkle's
         own box (clip-path) and scaled about its own centre (transform-origin), which
         buys per-sparkle timing without per-sparkle files.

         All of it is CSS keyframes: the CSP above is script-src 'self', so no inline
         <script> may run on this page; style-src allows 'unsafe-inline', so the
         screen is plain CSS over static markup. It paints and starts animating before
         the JS bundle has downloaded, so a cold start is not a blank page — and with
         no text on it, it needs no webfont to be correct at first paint. Teardown
         lives in the bundle, in src/composables/use-app-splash.ts, whose MIN_MS is
         what guarantees the entrance is seen rather than cut off. -->
    <link rel="preload" as="image" fetchpriority="high"
          href="<%= publicPath %>splash-core.png">
    <link rel="preload" as="image" fetchpriority="high"
          href="<%= publicPath %>splash-sparks.png">
    <style>
      #cd-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        /* --color-bg from app.css: the paper the app itself is painted on */
        background: #fafaf9;
        transition: opacity .4s cubic-bezier(.22, 1, .36, 1);
        /* Fail-open. use-app-splash.ts only runs once App.vue mounts, and the auth
           boot file awaits getSession() before that — so a hung or very slow auth
           call means the JS fuse is never even armed, and this overlay would trap
           the user behind a full-screen splash with no way out but a reload.
           This timer starts at first paint and needs no JS at all, so it holds
           even if the bundle never executes. Longer than the JS fuse (6s) so it
           only ever fires when that path failed to arm. */
        animation: cd-splash-failopen 1ms linear 8s forwards;
      }

      @keyframes cd-splash-failopen {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      /* Added by use-app-splash.ts; the element is removed once the fade ends */
      #cd-splash.is-out {
        opacity: 0;
        pointer-events: none;
      }

      .cd-splash__art {
        /* vmin sizes off the smaller axis, so the mark neither runs edge to edge on
           a narrow phone nor shrinks on a wide window; the px cap stops it
           ballooning on a desktop monitor. aspect-ratio is the artwork's own, so
           `contain` letterboxes nothing.

           32vmin lands at ~129pt on a 402pt-wide phone — a third of the width,
           which is where a launch mark sits: present, not filling the screen. The
           artwork's own file is cropped tight to its ink on all four sides, so
           centring the box centres what you see — the margin to the screen edge is
           equal left and right, and equal top and bottom. */
        position: relative;
        width: min(32vmin, 150px);
        aspect-ratio: 768 / 663;
      }

      /* Both layers fill the same box and carry the same canvas, so they line up
         however the box is sized. */
      .cd-splash__core,
      .cd-splash__spark {
        position: absolute;
        inset: 0;
        background: center / contain no-repeat;
      }

      .cd-splash__core {
        background-image: url('<%= publicPath %>splash-core.png');
        animation: cd-splash-rise .56s cubic-bezier(.22, 1, .36, 1) .06s both;
      }

      .cd-splash__spark {
        background-image: url('<%= publicPath %>splash-sparks.png');
        /* Pops in on its own beat, then breathes forever — the loop is what keeps a
           slow cold start from freezing into a still. The two delays below pair with
           these two animations in order. */
        animation:
          cd-splash-pop .42s cubic-bezier(.34, 1.56, .64, 1) both,
          cd-splash-twinkle 2.6s ease-in-out infinite;
      }

      /* One sparkle each: clipped to its own box, scaled about its own centre, lit
         90ms after the one before it. Boxes are measured from the artwork and do not
         overlap, so no sparkle is drawn twice. */
      .cd-splash__spark--1 {
        clip-path: inset(9.2% 80.7% 64.9% 0);
        transform-origin: 9.4% 22.1%;
        animation-delay: .24s, .66s;
      }

      .cd-splash__spark--2 {
        clip-path: inset(0 74.1% 89% 16.4%);
        transform-origin: 21.1% 5.2%;
        animation-delay: .33s, .75s;
      }

      .cd-splash__spark--3 {
        clip-path: inset(37.4% 0 51.4% 91.1%);
        transform-origin: 95.6% 42.9%;
        animation-delay: .42s, .84s;
      }

      .cd-splash__spark--4 {
        clip-path: inset(52% 2.2% 13.7% 73.6%);
        transform-origin: 85.6% 69.1%;
        animation-delay: .51s, .93s;
      }

      .cd-splash__spark--5 {
        clip-path: inset(50.2% 86.3% 40.4% 5.9%);
        transform-origin: 9.7% 54.8%;
        animation-delay: .6s, 1.02s;
      }

      @keyframes cd-splash-rise {
        from { opacity: 0; transform: translateY(10px) scale(.97); }
        to { opacity: 1; transform: none; }
      }

      @keyframes cd-splash-pop {
        from { opacity: 0; transform: scale(.3); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes cd-splash-twinkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .55; transform: scale(.92); }
      }

      /* Installed to the home screen, the page starts below the OS status bar, so
         the page's own centre sits half a status bar below the centre of the screen
         — which is what the eye judges against, since the app is the whole screen.
         Lift the mark by that half so it reads centred, the way a native launch
         image does. 28px is half of a modern iPhone's 54-62pt status bar; in a
         browser tab the page IS the frame, so there is no lift. */
      @media (display-mode: standalone) {
        .cd-splash__art {
          transform: translateY(-28px);
        }
      }

      /* Reduced motion: the mark, already arrived. The selector is `#cd-splash *`,
         children only — the fail-open on the container is a safety timer, not an
         effect, and must keep running. */
      @media (prefers-reduced-motion: reduce) {
        #cd-splash * {
          animation: none;
        }
      }

    </style>
  </head>
  <body>
    <!-- Launch screen: sits outside the quasar mount point so mounting cannot replace it -->
    <div id="cd-splash" aria-hidden="true">
      <div class="cd-splash__art">
        <div class="cd-splash__core"></div>
        <div class="cd-splash__spark cd-splash__spark--1"></div>
        <div class="cd-splash__spark cd-splash__spark--2"></div>
        <div class="cd-splash__spark cd-splash__spark--3"></div>
        <div class="cd-splash__spark cd-splash__spark--4"></div>
        <div class="cd-splash__spark cd-splash__spark--5"></div>
      </div>
    </div>

    <!-- quasar:entry-point -->
  </body>
</html>
